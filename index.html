<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Intel</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0f1a;
  --surface: #111827;
  --surface-hover: #1a2236;
  --surface-border: #1e293b;
  --teal: #2dd4bf;
  --teal-dim: rgba(45,212,191,.12);
  --coral: #f97066;
  --green: #4ade80;
  --text: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --radius: 14px;
  --radius-sm: 10px;
  --sidebar-w: 320px;
}

html, body { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  color: var(--text);
  background: var(--bg);
  overflow: hidden;
}

button { cursor: pointer; font: inherit; color: inherit; border: none; background: none; }
input, textarea { font: inherit; color: inherit; background: none; border: none; outline: none; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-border); border-radius: 3px; }

/* ── Layout ── */
.app { display: flex; height: 100vh; }

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--surface-border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: transform .25s ease, opacity .2s ease;
  z-index: 100;
}

.sidebar-header {
  padding: 22px 22px 0;
  display: flex;
  align-items: center;
  gap: 12px;
}

.sidebar-logo {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--teal), #06b6d4);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 16px; color: var(--bg);
}

.sidebar-title { font-size: 17px; font-weight: 700; letter-spacing: -.02em; }

.sidebar-scroll { flex: 1; overflow-y: auto; padding: 18px 22px 12px; display: flex; flex-direction: column; gap: 24px; }

.section-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--text-muted);
  margin-bottom: 10px;
}

/* ── Segmented Toggle ── */
.toggle-wrap {
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: 3px;
  display: flex;
  margin-bottom: 14px;
}

.toggle-btn {
  flex: 1;
  padding: 8px 0;
  text-align: center;
  font-size: 13px;
  font-weight: 600;
  border-radius: 8px;
  color: var(--text-muted);
  transition: all .2s;
}

.toggle-btn.active { background: var(--surface-hover); color: var(--text); }

/* ── Connection fields ── */
.field { margin-bottom: 12px; }

.field-label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 5px;
}

.field-input {
  width: 100%;
  padding: 9px 12px;
  background: var(--bg);
  border: 1px solid var(--surface-border);
  border-radius: 8px;
  font-size: 13px;
  color: var(--text);
  transition: border-color .15s;
}

.field-input:focus { border-color: var(--teal); }

.field-row { display: flex; align-items: center; gap: 10px; }

.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--text-muted);
  flex-shrink: 0;
  transition: background .3s;
}

.status-dot.connected { background: var(--green); }

.status-text { font-size: 12px; color: var(--text-muted); }

/* ── Slider ── */
.slider-wrap { display: flex; align-items: center; gap: 10px; }

.slider {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  background: var(--bg);
  border-radius: 2px;
  outline: none;
}

.slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--teal);
  cursor: pointer;
}

.slider-val { font-size: 13px; color: var(--text-secondary); min-width: 30px; text-align: right; }

/* ── Data List ── */
.data-section { flex: 1; min-height: 0; display: flex; flex-direction: column; }

.data-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }

.data-item {
  background: var(--bg);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  transition: border-color .15s;
}

.data-item:hover { border-color: var(--teal); }

.data-item-body { flex: 1; min-width: 0; }

.data-item-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  display: block;
  width: 100%;
  padding: 0;
  background: transparent;
  border: none;
  border-bottom: 1px solid transparent;
  transition: border-color .15s;
}

.data-item-label:focus { border-bottom-color: var(--teal); }

.data-item-preview {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.data-item-delete {
  opacity: 0;
  color: var(--coral);
  font-size: 14px;
  padding: 2px;
  transition: opacity .15s;
  flex-shrink: 0;
  margin-top: 1px;
}

.data-item:hover .data-item-delete { opacity: 1; }

.add-data-btn {
  width: 100%;
  padding: 10px;
  border: 1px dashed var(--surface-border);
  border-radius: var(--radius-sm);
  color: var(--teal);
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  margin-top: 8px;
  transition: background .15s, border-color .15s;
}

.add-data-btn:hover { background: var(--teal-dim); border-color: var(--teal); }

/* ── Sidebar Footer ── */
.sidebar-footer {
  padding: 14px 22px;
  border-top: 1px solid var(--surface-border);
  display: flex;
  gap: 16px;
}

.sidebar-footer button {
  font-size: 12px;
  color: var(--text-muted);
  transition: color .15s;
}

.sidebar-footer button:hover { color: var(--text); }

/* ── Main Area ── */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }

/* ── Topbar (mobile) ── */
.topbar {
  display: none;
  align-items: center;
  padding: 14px 18px;
  gap: 14px;
  border-bottom: 1px solid var(--surface-border);
}

.hamburger {
  display: flex; flex-direction: column; gap: 4px;
  padding: 4px;
}

.hamburger span {
  display: block; width: 20px; height: 2px;
  background: var(--text-secondary);
  border-radius: 1px;
}

.topbar-title { font-size: 15px; font-weight: 700; }

/* ── Overlay ── */
.sidebar-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 99;
}

/* ── Empty State ── */
.empty-state {
  flex: 1; display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  text-align: center;
  overflow-y: auto;
}

.empty-logo {
  width: 64px; height: 64px;
  background: linear-gradient(135deg, var(--teal), #06b6d4);
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; font-weight: 800; color: var(--bg);
  margin-bottom: 20px;
}

.empty-title {
  font-size: 28px; font-weight: 800;
  letter-spacing: -.03em;
  margin-bottom: 8px;
}

.empty-sub {
  color: var(--text-secondary);
  font-size: 15px;
  max-width: 380px;
  margin-bottom: 36px;
}

.prompt-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  max-width: 680px;
  width: 100%;
}

.prompt-card {
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  text-align: left;
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.4;
  transition: border-color .15s, color .15s, background .15s;
}

.prompt-card:hover {
  border-color: var(--teal);
  color: var(--text);
  background: var(--surface-hover);
}

/* ── Chat ── */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 24px 24px 8px;
  display: none;
  flex-direction: column;
  gap: 16px;
}

.msg { max-width: 720px; display: flex; gap: 12px; }

.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg.ai { align-self: flex-start; }

.msg-avatar {
  width: 32px; height: 32px;
  border-radius: 10px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700;
}

.msg.user .msg-avatar { background: var(--teal); color: var(--bg); }
.msg.ai .msg-avatar { background: var(--surface-hover); color: var(--teal); }

.msg-bubble {
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}

.msg.user .msg-bubble { background: var(--teal); color: var(--bg); border-bottom-right-radius: 4px; }
.msg.ai .msg-bubble { background: var(--surface); border: 1px solid var(--surface-border); color: var(--text); border-bottom-left-radius: 4px; }

/* ── Input Bar ── */
.input-bar {
  padding: 12px 24px 20px;
  display: flex;
  align-items: flex-end;
  gap: 10px;
}

.input-wrap {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius);
  padding: 12px 16px;
  display: flex;
  align-items: flex-end;
  transition: border-color .15s;
}

.input-wrap:focus-within { border-color: var(--teal); }

.input-wrap textarea {
  flex: 1;
  resize: none;
  font-size: 14px;
  line-height: 1.5;
  max-height: 140px;
  background: transparent;
  color: var(--text);
}

.input-wrap textarea::placeholder { color: var(--text-muted); }

.send-btn {
  width: 40px; height: 40px;
  background: var(--teal);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: opacity .15s;
}

.send-btn:disabled { opacity: .3; cursor: default; }

.send-btn svg { width: 18px; height: 18px; fill: var(--bg); }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.6);
  display: none; align-items: center; justify-content: center;
  z-index: 200;
  padding: 24px;
}

.modal-overlay.open { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: 16px;
  width: 100%;
  max-width: 520px;
  overflow: hidden;
}

.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 24px 0;
}

.modal-head h2 { font-size: 17px; font-weight: 700; }

.modal-close {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted);
  transition: background .15s;
  font-size: 18px;
}

.modal-close:hover { background: var(--surface-hover); }

/* ── Modal Tabs ── */
.modal-tabs {
  display: flex; gap: 0;
  padding: 16px 24px 0;
}

.modal-tab {
  padding: 8px 18px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s;
}

.modal-tab.active { color: var(--teal); border-bottom-color: var(--teal); }

.modal-body { padding: 20px 24px 24px; }

.modal-pane { display: none; }
.modal-pane.active { display: block; }

.modal-body .field-input { margin-bottom: 0; }

.modal-body textarea.field-input {
  min-height: 140px;
  resize: vertical;
  font-size: 13px;
  line-height: 1.5;
}

.drop-zone {
  border: 2px dashed var(--surface-border);
  border-radius: var(--radius-sm);
  padding: 40px 20px;
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
  transition: border-color .15s, background .15s;
  cursor: pointer;
}

.drop-zone.drag-over { border-color: var(--teal); background: var(--teal-dim); }

.drop-zone-label { margin-top: 8px; color: var(--text-secondary); font-weight: 500; }

.drop-zone input { display: none; }

.drop-zone .file-name { color: var(--teal); font-weight: 600; margin-top: 8px; }

.modal-actions {
  display: flex; justify-content: flex-end; gap: 10px;
  padding: 0 24px 20px;
}

.btn-secondary {
  padding: 9px 18px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  background: var(--bg);
  color: var(--text-secondary);
  transition: background .15s;
}

.btn-secondary:hover { background: var(--surface-hover); }

.btn-primary {
  padding: 9px 22px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  background: var(--teal);
  color: var(--bg);
  transition: opacity .15s;
}

.btn-primary:hover { opacity: .85; }
.btn-primary:disabled { opacity: .4; cursor: default; }

/* ── Responsive ── */
@media (max-width: 768px) {
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0;
    transform: translateX(-100%);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay.open { display: block; }
  .topbar { display: flex; }
  .prompt-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 480px) {
  .prompt-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">H</div>
      <span class="sidebar-title">Health Intel</span>
    </div>

    <div class="sidebar-scroll">
      <!-- Connection -->
      <div>
        <div class="section-label">Connection</div>
        <div class="toggle-wrap">
          <button class="toggle-btn active" data-mode="local">Local</button>
          <button class="toggle-btn" data-mode="cloud">Cloud</button>
        </div>

        <!-- Local fields -->
        <div id="localFields">
          <div class="field">
            <label class="field-label">Base URL</label>
            <input class="field-input" id="baseUrl" value="http://localhost:1234/v1/chat/completions" />
          </div>
          <div class="field">
            <label class="field-label">Model</label>
            <input class="field-input" id="modelName" placeholder="e.g. llama-3" />
          </div>
          <div class="field">
            <div class="field-row">
              <div class="status-dot" id="localStatus"></div>
              <span class="status-text">Not connected</span>
            </div>
          </div>
          <div class="field">
            <label class="field-label">Temperature</label>
            <div class="slider-wrap">
              <input type="range" class="slider" min="0" max="1" step="0.05" value="0.4" id="localTemp" />
              <span class="slider-val" id="localTempVal">0.4</span>
            </div>
          </div>
        </div>

        <!-- Cloud fields -->
        <div id="cloudFields" style="display:none">
          <div class="field">
            <label class="field-label">API Key</label>
            <input class="field-input" type="password" id="apiKey" placeholder="sk-..." />
          </div>
          <div class="field">
            <div class="field-row">
              <div class="status-dot" id="cloudStatus"></div>
              <span class="status-text">Not connected</span>
            </div>
          </div>
          <div class="field">
            <label class="field-label">Temperature</label>
            <div class="slider-wrap">
              <input type="range" class="slider" min="0" max="1" step="0.05" value="0.4" id="cloudTemp" />
              <span class="slider-val" id="cloudTempVal">0.4</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Your Data -->
      <div class="data-section">
        <div class="section-label">Your Data</div>
        <div class="data-list" id="dataList"></div>
        <button class="add-data-btn" id="addDataBtn">+ Add Data</button>
      </div>
    </div>

    <div class="sidebar-footer">
      <button id="exportChatBtn">Export Chat</button>
      <button id="clearChatBtn">Clear Chat</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <!-- Topbar mobile -->
    <div class="topbar">
      <button class="hamburger" id="hamburgerBtn">
        <span></span><span></span><span></span>
      </button>
      <span class="topbar-title">Health Intel</span>
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState">
      <div class="empty-logo">H</div>
      <h1 class="empty-title">Health Intel</h1>
      <p class="empty-sub">Paste your lab results, doctor's notes, or health data — then ask anything.</p>
      <div class="prompt-grid" id="promptGrid">
        <button class="prompt-card">Full health overview</button>
        <button class="prompt-card">What looks good?</button>
        <button class="prompt-card">What's concerning?</button>
        <button class="prompt-card">How can I improve?</button>
        <button class="prompt-card">Best &amp; worst case scenarios</button>
        <button class="prompt-card">Deep-dive doctor's notes</button>
        <button class="prompt-card">Explain panels simply</button>
        <button class="prompt-card">Follow-up tests needed</button>
        <button class="prompt-card">Lifestyle changes</button>
        <button class="prompt-card">Red flags to watch</button>
        <button class="prompt-card">Compare to optimal</button>
        <button class="prompt-card">Action plan</button>
      </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chatArea"></div>

    <!-- Input Bar -->
    <div class="input-bar">
      <div class="input-wrap">
        <textarea rows="1" placeholder="Ask about your health data..." id="chatInput"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" disabled>
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </main>
</div>

<!-- Add Data Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2>Add Health Data</h2>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-tabs">
      <button class="modal-tab active" data-tab="paste">Paste</button>
      <button class="modal-tab" data-tab="upload">Upload</button>
    </div>
    <div class="modal-body">
      <div class="modal-pane active" id="pastePane">
        <div class="field" style="margin-bottom:12px">
          <label class="field-label">Label</label>
          <input class="field-input" id="pasteLabel" placeholder="e.g. Blood Panel — March 2026" />
        </div>
        <div class="field">
          <label class="field-label">Data</label>
          <textarea class="field-input" id="pasteContent" placeholder="Paste lab results, notes, CSV data..."></textarea>
        </div>
      </div>
      <div class="modal-pane" id="uploadPane">
        <div class="field" style="margin-bottom:12px">
          <label class="field-label">Label</label>
          <input class="field-input" id="uploadLabel" placeholder="e.g. Blood Panel — March 2026" />
        </div>
        <div class="drop-zone" id="dropZone">
          <div>&#128196;</div>
          <div class="drop-zone-label">Drop a .txt or .csv file here, or click to browse</div>
          <input type="file" accept=".txt,.csv" id="fileInput" />
          <div class="file-name" id="fileName" style="display:none"></div>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="modalCancel">Cancel</button>
      <button class="btn-primary" id="modalSave" disabled>Add Data</button>
    </div>
  </div>
</div>

<script>
// ── State ──
let healthData = [];
let chatMessages = [];
let connectionMode = 'local';
let uploadedFileContent = null;

// ── DOM refs ──
const $ = s => document.querySelector(s);
const sidebar = $('#sidebar');
const overlay = $('#sidebarOverlay');
const emptyState = $('#emptyState');
const chatArea = $('#chatArea');
const chatInput = $('#chatInput');
const sendBtn = $('#sendBtn');
const dataList = $('#dataList');
const modalOverlay = $('#modalOverlay');

// ── Sidebar Toggle ──
$('#hamburgerBtn').addEventListener('click', () => {
  sidebar.classList.add('open');
  overlay.classList.add('open');
});

function closeSidebar() {
  sidebar.classList.remove('open');
  overlay.classList.remove('open');
}
overlay.addEventListener('click', closeSidebar);

// ── Connection Mode Toggle ──
document.querySelectorAll('.toggle-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    connectionMode = btn.dataset.mode;
    $('#localFields').style.display = connectionMode === 'local' ? '' : 'none';
    $('#cloudFields').style.display = connectionMode === 'cloud' ? '' : 'none';
  });
});

// ── Temperature Sliders ──
$('#localTemp').addEventListener('input', e => { $('#localTempVal').textContent = e.target.value; });
$('#cloudTemp').addEventListener('input', e => { $('#cloudTempVal').textContent = e.target.value; });

// ── Data Management ──
function genId() { return Math.random().toString(36).slice(2, 10); }

function renderData() {
  dataList.innerHTML = '';
  healthData.forEach(d => {
    const el = document.createElement('div');
    el.className = 'data-item';
    const preview = d.content.slice(0, 60).replace(/\n/g, ' ');
    el.innerHTML = `
      <div class="data-item-body">
        <input class="data-item-label" value="${escHtml(d.label)}" data-id="${d.id}" />
        <div class="data-item-preview">${escHtml(preview)}</div>
      </div>
      <button class="data-item-delete" data-id="${d.id}">&times;</button>
    `;
    dataList.appendChild(el);
  });

  dataList.querySelectorAll('.data-item-label').forEach(inp => {
    inp.addEventListener('change', e => {
      const item = healthData.find(d => d.id === e.target.dataset.id);
      if (item) item.label = e.target.value;
    });
  });

  dataList.querySelectorAll('.data-item-delete').forEach(btn => {
    btn.addEventListener('click', e => {
      healthData = healthData.filter(d => d.id !== btn.dataset.id);
      renderData();
    });
  });
}

function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ── Modal ──
function openModal() {
  modalOverlay.classList.add('open');
  $('#pasteLabel').value = '';
  $('#pasteContent').value = '';
  $('#uploadLabel').value = '';
  $('#fileName').style.display = 'none';
  $('#fileName').textContent = '';
  $('#fileInput').value = '';
  uploadedFileContent = null;
  setModalTab('paste');
  validateModal();
}

function closeModal() { modalOverlay.classList.remove('open'); }

$('#addDataBtn').addEventListener('click', openModal);
$('#modalClose').addEventListener('click', closeModal);
$('#modalCancel').addEventListener('click', closeModal);
modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });

// Modal tabs
function setModalTab(tab) {
  document.querySelectorAll('.modal-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  $('#pastePane').classList.toggle('active', tab === 'paste');
  $('#uploadPane').classList.toggle('active', tab === 'upload');
}

document.querySelectorAll('.modal-tab').forEach(t => {
  t.addEventListener('click', () => { setModalTab(t.dataset.tab); validateModal(); });
});

// Validate
function validateModal() {
  const tab = document.querySelector('.modal-tab.active').dataset.tab;
  let valid = false;
  if (tab === 'paste') {
    valid = $('#pasteLabel').value.trim() && $('#pasteContent').value.trim();
  } else {
    valid = $('#uploadLabel').value.trim() && uploadedFileContent;
  }
  $('#modalSave').disabled = !valid;
}

$('#pasteLabel').addEventListener('input', validateModal);
$('#pasteContent').addEventListener('input', validateModal);
$('#uploadLabel').addEventListener('input', validateModal);

// File upload
const dropZone = $('#dropZone');
const fileInput = $('#fileInput');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFile(fileInput.files[0]); });

function handleFile(file) {
  if (!file.name.match(/\.(txt|csv)$/i)) return;
  const reader = new FileReader();
  reader.onload = () => {
    uploadedFileContent = reader.result;
    $('#fileName').textContent = file.name;
    $('#fileName').style.display = '';
    if (!$('#uploadLabel').value.trim()) {
      $('#uploadLabel').value = file.name.replace(/\.(txt|csv)$/i, '');
    }
    validateModal();
  };
  reader.readAsText(file);
}

// Save
$('#modalSave').addEventListener('click', () => {
  const tab = document.querySelector('.modal-tab.active').dataset.tab;
  let label, content;
  if (tab === 'paste') {
    label = $('#pasteLabel').value.trim();
    content = $('#pasteContent').value.trim();
  } else {
    label = $('#uploadLabel').value.trim();
    content = uploadedFileContent;
  }
  if (!label || !content) return;
  healthData.push({ id: genId(), label, content, addedAt: new Date().toISOString() });
  renderData();
  closeModal();
});

// ── Chat ──
function showChat() {
  emptyState.style.display = 'none';
  chatArea.style.display = 'flex';
}

function renderMessages() {
  chatArea.innerHTML = '';
  chatMessages.forEach(m => {
    const div = document.createElement('div');
    div.className = `msg ${m.role}`;
    div.innerHTML = `
      <div class="msg-avatar">${m.role === 'user' ? 'Y' : 'H'}</div>
      <div class="msg-bubble">${escHtml(m.content)}</div>
    `;
    chatArea.appendChild(div);
  });
  chatArea.scrollTop = chatArea.scrollHeight;
}

function sendMessage(text) {
  text = text.trim();
  if (!text) return;
  chatMessages.push({ role: 'user', content: text });
  showChat();
  renderMessages();
  chatInput.value = '';
  autoGrow();
  sendBtn.disabled = true;

  // Placeholder AI response
  setTimeout(() => {
    chatMessages.push({ role: 'ai', content: 'AI integration is not yet connected. Configure your connection in the sidebar and this will respond with real analysis.' });
    renderMessages();
  }, 400);
}

// Prompt cards
document.querySelectorAll('.prompt-card').forEach(card => {
  card.addEventListener('click', () => sendMessage(card.textContent));
});

// Send button
sendBtn.addEventListener('click', () => sendMessage(chatInput.value));

// Input handling
chatInput.addEventListener('input', () => {
  sendBtn.disabled = !chatInput.value.trim();
  autoGrow();
});

chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage(chatInput.value);
  }
});

function autoGrow() {
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 140) + 'px';
}

// ── Export / Clear ──
$('#exportChatBtn').addEventListener('click', () => {
  if (!chatMessages.length) return;
  const text = chatMessages.map(m => `[${m.role.toUpperCase()}]\n${m.content}`).join('\n\n---\n\n');
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'health-intel-chat.txt';
  a.click();
  URL.revokeObjectURL(a.href);
});

$('#clearChatBtn').addEventListener('click', () => {
  chatMessages = [];
  chatArea.innerHTML = '';
  chatArea.style.display = 'none';
  emptyState.style.display = '';
  chatInput.value = '';
  sendBtn.disabled = true;
});
</script>
</body>
